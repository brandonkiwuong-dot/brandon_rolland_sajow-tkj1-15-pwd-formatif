<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Kumpulan Tombol</title>
    <style>
        body {
            background-color: #f0f9ff;
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        h2 {
            color: #1e3a8a;
            font-size: 20px;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }

        .button-group .btn {
            margin-right: 10px;
            margin-bottom: 10px;
        }

        .btn-primary {
            background-color: #ea580c;
            color: #ffffff;
        }

        .btn-secondary {
            background-color: #1e3a8a;
            color: #ffffff;
        }

        .btn-outline {
            background-color: #ffffff;
            border: 2px solid #ea580c;
            color: #ea580c;
        }

        .btn-send {
            background-color: #0284c7;
            color: #ffffff;
        }

        .btn-primary:hover {
            background-color: #c2410c;
        }

        .btn-secondary:hover {
            background-color: #1e40af;
        }

        .btn-outline:hover {
            background-color: #fff7ed;
        }

        .btn-send:hover {
            background-color: #0369a1;
        }
    </style>
</head>
<body>
    <main>
        <h2>Normal</h2>
        <div class="button-group">
            <a href="#" class="btn btn-primary">Lihat Proyek</a>
            <a href="#" class="btn btn-secondary">Unduh CV</a>
            <a href="#" class="btn btn-outline">Hubungi Saya</a>
            <a href="#" class="btn btn-send">Kirim Pesan</a>
        </div>
    </main>

    <footer style="margin-top: 40px;">
        <a href="../index.html" style="color: #ea580c; font-weight: bold;">Kembali ke Beranda</a>
    </footer>
</body>
</html>
